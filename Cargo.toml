[package]
name = "cis2_ref"
version = "0.1.0"
edition = "2024"

# CIS-2 fp32 reference implementation (E15b, milestone 1).
# See docs/E15b_REFERENCE_RESULT.md for background.

[[bin]]
name = "cis2-conformance"
path = "src/bin/cis2_conformance.rs"

[dependencies]
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
sha2 = "0.11"
serde_json = "1"

[profile.release]
opt-level = 3
# No lto/codegen-units pinning needed for correctness (only reduction order
# and FMA-contraction matter, both source-level per CIS-2 §3.1/§3.2 — see
# src/math.rs). Debug builds are also normative-conformant; release is used
# only for speed.
