name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  # docs/CIS2_SPEC_v0.3b.md §13.1, EXPECTED_DIGESTS.md
  EXPECTED_WITNESS: d82743059d1db929e710236fe4ec37f89e6f932524801345a006980f7c3cc9df
  EXPECTED_ARGMAX: 0b9c8f3ac90d0b9cd5f1719ac327dca1fc639fd87468305fccebbe3d56f67aff
  EXPECTED_TABLE: 23c7bfaf5cef0095fd021af2eb1808abb4928bae4219756d86bdac670a06b35d
  EXPECTED_INVFREQ: da9f6dcfde0425588815509e874515cdcd3d6b8818b6d0136590052e7bbf6f12
  WEIGHTS_SHA256: 80521b40281d6ce74e35c9282c22539e75aa0ac8578892b2a59955ef78d55da1

jobs:
  # --- reference: src/, the Rust reference implementation the spec was
  # audited against (docs/CIS2_SPEC_v0.3b.md Appendix A). Not a clean-room:
  # this is the implementation the spec text describes.
  reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            arch_label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: uname (assert matches expected arch)
        run: |
          U=$(uname -m)
          if [ "${{ matrix.arch_label }}" = "x86_64" ]; then
            [ "$U" = "x86_64" ] || { echo "expected x86_64, got $U"; exit 1; }
          else
            [ "$U" = "aarch64" ] || { echo "expected aarch64, got $U"; exit 1; }
          fi

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Fetch pinned weights (SmolLM2-135M)
        run: |
          chmod +x scripts/fetch_weights.sh
          ./scripts/fetch_weights.sh weights

      - name: Build reference (release)
        run: cargo build --release -j2

      - name: FMA gate (objdump, zero fused multiply-add on decode path)
        run: |
          objdump -d target/release/cis2_ref > /tmp/disasm_ref.txt
          if grep -Ei 'vfmadd|vfnmadd|vfmsub|vfnmsub|fmadd|fmsub|fmla|fmls' /tmp/disasm_ref.txt; then
            echo "FMA-family instruction found in disassembly — spec §1.4 violation"
            exit 1
          fi
          echo "FMA gate: PASS (0 matches)"

      - name: Run reference and check witness digest
        run: |
          set -euo pipefail
          OUT=$(nice ./target/release/cis2_ref | tee /tmp/reference_output.txt)
          witness=$(echo "$OUT" | grep -oP '(?<=^CIS2_REF digest=)[0-9a-f]+' | head -1 || true)
          echo "witness: got=$witness expected=$EXPECTED_WITNESS"
          [ "$witness" = "$EXPECTED_WITNESS" ] || { echo "MISMATCH: witness digest"; exit 1; }
          echo "PASS: reference (${{ matrix.arch_label }}) matches CIS2_REF"

  # --- conformance: E21 cis2-conformance suite (tests/conformance/PROTOCOL.md)
  # run dual-ISA against the in-repo reference candidate
  # (src/bin/cis2_conformance_reference_candidate.rs). Each ISA job
  # independently asserts all pinned vectors pass; the vectors are pinned
  # digests (tests/conformance/vectors/*.expected) so identical PASS on
  # both ISAs is the cross-ISA agreement check (no wall-clock/timing
  # comparison — correctness gate only).
  conformance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            arch_label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: uname (assert matches expected arch)
        run: |
          U=$(uname -m)
          if [ "${{ matrix.arch_label }}" = "x86_64" ]; then
            [ "$U" = "x86_64" ] || { echo "expected x86_64, got $U"; exit 1; }
          else
            [ "$U" = "aarch64" ] || { echo "expected aarch64, got $U"; exit 1; }
          fi

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Build cis2-conformance and reference candidate (release)
        run: cargo build --release -j2 --bin cis2-conformance --bin cis2_conformance_reference_candidate

      - name: Run cis2-conformance suite against reference candidate
        run: |
          set -euo pipefail
          ./target/release/cis2-conformance ./target/release/cis2_conformance_reference_candidate | tee /tmp/conformance_output.txt
          grep -qE '^all [0-9]+ vector\(s\) passed$' /tmp/conformance_output.txt || { echo "MISMATCH: not all conformance vectors passed (${{ matrix.arch_label }})"; exit 1; }
          echo "PASS: conformance suite (${{ matrix.arch_label }}) — all vectors passed"

  # --- verify2: Rust clean-room ---
  verify2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            arch_label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: uname (assert matches expected arch)
        run: |
          U=$(uname -m)
          if [ "${{ matrix.arch_label }}" = "x86_64" ]; then
            [ "$U" = "x86_64" ] || { echo "expected x86_64, got $U"; exit 1; }
          else
            [ "$U" = "aarch64" ] || { echo "expected aarch64, got $U"; exit 1; }
          fi

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Fetch pinned weights (SmolLM2-135M)
        run: |
          chmod +x scripts/fetch_weights.sh
          ./scripts/fetch_weights.sh weights

      - name: Build verify2 (release)
        working-directory: verify2
        run: cargo build --release -j2

      - name: FMA gate (objdump, zero fused multiply-add on decode path)
        run: |
          objdump -d verify2/target/release/cis2-verify2 > /tmp/disasm.txt
          if grep -Ei 'vfmadd|vfnmadd|vfmsub|vfnmsub|fmadd|fmsub|fmla|fmls' /tmp/disasm.txt; then
            echo "FMA-family instruction found in disassembly — spec §1.4 violation"
            exit 1
          fi
          echo "FMA gate: PASS (0 matches)"

      - name: Run verify2 and check digests
        run: |
          set -euo pipefail
          OUT=$(./verify2/target/release/cis2-verify2 | tee /tmp/verify2_output.txt)
          witness=$(echo "$OUT" | grep -oP '(?<=CIS2_VERIFY2 digest=)[0-9a-f]+' | head -1 || true)
          echo "witness: got=$witness expected=$EXPECTED_WITNESS"
          [ "$witness" = "$EXPECTED_WITNESS" ] || { echo "MISMATCH: witness digest"; exit 1; }
          echo "PASS: verify2 (${{ matrix.arch_label }}) matches CIS2_REF"

  # --- cis2-verify: fourth clean-room implementation, zero dependencies ---
  # This crate had no CI job at all until now: it was built and tested only by
  # hand. It is the standalone verifier a third party is meant to run, so it is
  # the one implementation that most needs a green check next to it.
  cis2-verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x86_64
          - os: ubuntu-24.04-arm
            arch_label: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: uname (assert matches expected arch)
        run: |
          U=$(uname -m)
          if [ "${{ matrix.arch_label }}" = "x86_64" ]; then
            [ "$U" = "x86_64" ] || { echo "expected x86_64, got $U"; exit 1; }
          else
            [ "$U" = "aarch64" ] || { echo "expected aarch64, got $U"; exit 1; }
          fi

      - name: Install Rust (pinned via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      # src/unicode.rs is a generated file. Checking that it is still exactly
      # what the generator produces is what makes "generated from the UCD" a
      # verifiable statement rather than a comment.
      #
      # The UCD version has to be pinned here, not inherited from the runner:
      # \p{L} is version-dependent (Unicode 15.1 added 622 codepoints,
      # U+2EBF0..U+2EE5D, that 15.0 does not classify as letters), and these
      # images ship a Python carrying 15.0.0 while the tables are generated
      # from 15.1.0. Without the pin this step compares two different Unicode
      # versions and fails for a reason that has nothing to do with the repo.
      - name: Pin the Unicode Character Database
        run: python3 -m pip install --quiet --break-system-packages unicodedata2==15.1.0
      - name: Generated Unicode tables are current
        working-directory: cis2-verify
        run: python3 tools/gen_unicode.py

      # Runs before the 500 MB fetch on purpose: the unit tests and the
      # committed 2.8 kB fixture in tests/fixtures/tiny cover the whole
      # pipeline without any download, so an arithmetic or receipt-format
      # regression fails here in seconds rather than after the weights land.
      - name: Test suite (no artifacts needed)
        working-directory: cis2-verify
        run: cargo test --release -j2

      - name: Build cis2-verify (release)
        working-directory: cis2-verify
        run: cargo build --release -j2

      - name: Self-test (fp environment, table digest, cancellation regression)
        run: ./cis2-verify/target/release/cis2-verify selftest

      - name: FMA gate (objdump, zero fused multiply-add on decode path)
        run: |
          objdump -d cis2-verify/target/release/cis2-verify > /tmp/disasm_cv.txt
          if grep -Ei 'vfmadd|vfnmadd|vfmsub|vfnmsub|fmadd|fmsub|fmla|fmls' /tmp/disasm_cv.txt; then
            echo "FMA-family instruction found in disassembly - spec 1.4 violation"
            exit 1
          fi
          echo "FMA gate: PASS (0 matches)"

      - name: Fetch pinned weights (SmolLM2-135M)
        run: |
          chmod +x scripts/fetch_weights.sh
          ./scripts/fetch_weights.sh weights

      - name: Run against the pinned test vector (spec 13.1)
        run: |
          set -euo pipefail
          OUT=$(./cis2-verify/target/release/cis2-verify run weights -o /tmp/cv_receipt.txt | tee /tmp/cv_output.txt)
          witness=$(echo "$OUT" | grep -oP '(?<=CIS2-VERIFY digest=)[0-9a-f]+' | head -1 || true)
          echo "witness: got=$witness expected=$EXPECTED_WITNESS"
          [ "$witness" = "$EXPECTED_WITNESS" ] || { echo "MISMATCH: witness digest"; exit 1; }
          grep -q 'CIS2-VERIFY conformance=PASS' /tmp/cv_output.txt \
            || { echo "conformance line missing or not PASS"; exit 1; }
          echo "PASS: cis2-verify (${{ matrix.arch_label }}) matches CIS2_REF"

      - name: Re-verify the receipt it just wrote (round trip on real artifacts)
        run: |
          set -euo pipefail
          ./cis2-verify/target/release/cis2-verify verify weights /tmp/cv_receipt.txt | tee /tmp/cv_verify.txt
          grep -q 'CIS2-VERIFY VERIFY PASS' /tmp/cv_verify.txt || { echo "round trip failed"; exit 1; }

      - name: A doctored receipt must be rejected (negative control)
        run: |
          set -euo pipefail
          # Without this, the step above would pass just as happily against a
          # verifier that returned PASS unconditionally.
          # Flip the last hex nibble of the argmax digest: 0 -> 1, anything
          # else -> 0. Never a no-op, whatever the digest happens to start or
          # end with. (The first draft of this replaced the leading nibble
          # with 0; the real digest starts with 0, so it changed nothing and
          # the control silently passed against an unmodified receipt.)
          sed -E 's/^(argmax-digest [0-9a-f]{63})0$/\11/; t; s/^(argmax-digest [0-9a-f]{63})[1-9a-f]$/\10/' \
            /tmp/cv_receipt.txt > /tmp/cv_bad.txt
          cmp -s /tmp/cv_receipt.txt /tmp/cv_bad.txt && { echo "mutation was a no-op"; exit 1; }
          if ./cis2-verify/target/release/cis2-verify verify weights /tmp/cv_bad.txt; then
            echo "a doctored receipt verified clean - the verifier is not binding"
            exit 1
          fi
          echo "negative control: PASS (doctored receipt rejected)"

  # --- verify3: C clean-room, gcc and clang ---
  verify3:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch_label: x86_64
            cc: gcc
          - os: ubuntu-24.04
            arch_label: x86_64
            cc: clang
          - os: ubuntu-24.04-arm
            arch_label: aarch64
            cc: gcc
          - os: ubuntu-24.04-arm
            arch_label: aarch64
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc clang binutils curl

      - name: Fetch pinned weights (SmolLM2-135M)
        run: |
          chmod +x scripts/fetch_weights.sh
          ./scripts/fetch_weights.sh weights

      - name: Build verify3 (${{ matrix.cc }}, ${{ matrix.arch_label }})
        working-directory: verify3
        run: make CC=${{ matrix.cc }}

      - name: FMA gate (objdump, zero fused multiply-add on decode path)
        working-directory: verify3
        run: |
          objdump -d cis2_verify3 > /tmp/disasm.txt
          if grep -Ei 'vfmadd|vfnmadd|vfmsub|vfnmsub|fmadd|fmsub|fmla|fmls' /tmp/disasm.txt; then
            echo "FMA-family instruction found in disassembly — spec §1.4 violation"
            exit 1
          fi
          echo "FMA gate: PASS (0 matches)"

      - name: Run cis2_verify3
        working-directory: verify3
        run: ./cis2_verify3 ../weights/model.safetensors ../weights/config.json ../weights/tokenizer.json | tee /tmp/verify3_output.txt

      - name: Compare digests against v0.2 pinned test vector (spec §13.1)
        run: |
          out=/tmp/verify3_output.txt
          witness=$(grep -oP '(?<=^CIS2_VERIFY3 digest=)[0-9a-f]+' "$out")
          argmax=$(grep -oP '(?<=^CIS2_VERIFY3 argmax_digest=)[0-9a-f]+' "$out")
          table=$(grep -oP '(?<=^CIS2_VERIFY3 table_digest=)[0-9a-f]+' "$out")
          invfreq=$(grep -oP '(?<=^CIS2_VERIFY3 inv_freq_table_digest=)[0-9a-f]+' "$out")

          echo "witness: got=$witness expected=$EXPECTED_WITNESS"
          echo "argmax:  got=$argmax expected=$EXPECTED_ARGMAX"
          echo "table:   got=$table expected=$EXPECTED_TABLE"
          echo "invfreq: got=$invfreq expected=$EXPECTED_INVFREQ"

          fail=0
          [ "$witness" = "$EXPECTED_WITNESS" ] || { echo "MISMATCH: witness digest (CIS2_REF)"; fail=1; }
          [ "$argmax" = "$EXPECTED_ARGMAX" ] || { echo "MISMATCH: argmax digest"; fail=1; }
          [ "$table" = "$EXPECTED_TABLE" ] || { echo "MISMATCH: table digest"; fail=1; }
          [ "$invfreq" = "$EXPECTED_INVFREQ" ] || { echo "MISMATCH: inv_freq_table digest"; fail=1; }
          exit $fail
