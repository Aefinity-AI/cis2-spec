[package]
name = "cis2-verify2"
version = "0.1.0"
edition = "2021"

# E15g clean-room attempt #2: implemented from docs/CIS2_SPEC_v0.1.md text
# alone. Do not add code read from src/, tests/, or verify/ in this crate.

[[bin]]
name = "cis2-verify2"
path = "src/main.rs"

[dependencies]
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
sha2 = "0.11"
serde_json = "1"

[profile.release]
opt-level = 3
